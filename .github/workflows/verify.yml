name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run contract:generate && git diff --exit-code contracts/generated.ts
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx supabase start > /dev/null
      - run: npx supabase db reset --local
      - run: npm run db:test
      - run: npm run build
      - name: Real Auth and HTTP production flow (disposable local stack only)
        run: npm run test:http-local
        env:
          PLOCKIVO_LOCAL_HTTP_TEST: '1'
      - name: Remove disposable local database and Auth data
        if: always()
        run: npx supabase stop --no-backup

